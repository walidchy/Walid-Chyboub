<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradient-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb7185;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#gradient-bg)" />
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#gradient-accent)" stroke-width="4" opacity="0.3" />

  <!-- Code Icon Symbols -->
  <g transform="translate(64, 128) scale(0.75)" filter="url(#glow)">
    <!-- Bracket Left -->
    <path d="M120 40 L40 128 L120 216" fill="none" stroke="url(#gradient-accent)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Initials -->
    <text x="180" y="170" fill="white" style="font-family:'Inter', sans-serif; font-weight: 800; font-size: 160px;">WC</text>
    
    <!-- Slash / Bracket Right -->
    <path d="M400 40 L480 128 L400 216" fill="none" stroke="url(#gradient-accent)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Signature Dot -->
  <circle cx="420" cy="420" r="24" fill="#f43f5e" />
</svg>

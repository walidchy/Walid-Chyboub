<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#020617" />
    </linearGradient>
    
    <!-- Vivid Red Core -->
    <linearGradient id="red-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4d6d" />
      <stop offset="50%" style="stop-color:#f43f5e" />
      <stop offset="100%" style="stop-color:#e11d48" />
    </linearGradient>
    
    <!-- Metallic/Glass Overlay -->
    <linearGradient id="glass-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="ultra-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="140" fill="url(#bg-grad)" />
  
  <!-- Subtle Border Glow -->
  <rect x="10" y="10" width="492" height="492" rx="130" fill="none" stroke="url(#red-core)" stroke-width="2" opacity="0.4" />

  <!-- The Monogram Group -->
  <g transform="translate(60, 60) scale(0.77)">
    <!-- Shadow for depth -->
    <path d="M50 100 L150 400 L250 200 L350 400 L450 100" fill="none" stroke="#000" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" transform="translate(10, 10)" />
    
    <!-- 'W' Monogram Core -->
    <path d="M50 100 L150 400 L250 200 L350 400 L450 100" fill="none" stroke="url(#red-core)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" filter="url(#ultra-glow)" />
    
    <!-- 'C' Wrapping Element - Stylized as an arc -->
    <path d="M420 80 A210 210 0 1 1 420 420" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" opacity="0.15" />
    <path d="M420 80 A210 210 0 1 1 420 420" fill="none" stroke="url(#glass-shine)" stroke-width="40" stroke-linecap="round" />
  </g>

  <!-- Accent Detail -->
  <circle cx="410" cy="410" r="28" fill="url(#red-core)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="410" cy="410" r="40" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.3" />
</svg>
